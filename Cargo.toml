[workspace.package]
version = "0.0.1-pre"
edition = "2024"
publish = false
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace]
resolver = "3"
members = [
  "crates/base",
  "crates/collections",
  "crates/store",
]

[workspace.dependencies]
copper-store = { path = "./crates/store" }

nebz = "0.2.0"
thiserror = "2"
