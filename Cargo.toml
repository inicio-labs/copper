[workspace.package]
version = "0.0.1-pre"
edition = "2024"
publish = false
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace]
resolver = "3"
members = [
  "crates/app",
  "crates/base",
  "crates/collections",
  "crates/store",
  "crates/x/*",
]

[workspace.dependencies]
copper-base = { path = "./crates/base" }
copper-collections = { path = "./crates/collections" }
copper-facet-account = { path = "./crates/x/account" }
copper-facet-bank = { path = "./crates/x/bank" }
copper-store = { path = "./crates/store" }

malachitebft-app-channel = { package = "informalsystems-malachitebft-app-channel", version = "0.4.0" }
malachitebft-core-types = { package = "informalsystems-malachitebft-core-types", version = "0.4.0" }
malachitebft-proto = { package = "informalsystems-malachitebft-proto", version = "0.4.0" }
malachitebft-sync = { package = "informalsystems-malachitebft-sync", version = "0.4.0" }
malachitebft-test = { package = "informalsystems-malachitebft-test", version = "0.4.0", git = "https://github.com/informalsystems/malachite", tag = "v0.4.0" }
malachitebft-test-cli = { package = "informalsystems-malachitebft-test-cli", version = "0.4.0", git = "https://github.com/informalsystems/malachite", tag = "v0.4.0" }

anyhow = "1"
borsh = "1.5"
bytes = "1"
iavl = { git = "https://github.com/inicio-labs/iavl.git", tag = "v0.1.0-alpha.2" }
nebz = "0.2.1"
serde = "1"
sha2 = "0.10"
thiserror = "2"

[patch.crates-io]
malachitebft-app-channel = { package = "informalsystems-malachitebft-app-channel", version = "0.4.0", git = "https://github.com/informalsystems/malachite", tag = "v0.4.0" }
malachitebft-core-types = { package = "informalsystems-malachitebft-core-types", version = "0.4.0", git = "https://github.com/informalsystems/malachite", tag = "v0.4.0" }
malachitebft-sync = { package = "informalsystems-malachitebft-sync", version = "0.4.0", git = "https://github.com/informalsystems/malachite", tag = "v0.4.0" }
malachitebft-proto = { package = "informalsystems-malachitebft-proto", version = "0.4.0", git = "https://github.com/informalsystems/malachite", tag = "v0.4.0" }
